<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
</head>
<body>
    <h1>Courses</h1>
    {% for course, students in courses.items() %}
    <h2>{{ course }}</h2>
    <p><a href="/courses/{{ course }}/add_student">Add Student to {{ course }}</a></p>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Faculty</th>
            <th>Grade</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.faculty }}</td>
            <td>{{ student.grade }}</td>
        </tr>
        {% endfor %}
    </table>
    {% endfor %}
</body>
</html>
